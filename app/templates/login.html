<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | CourtStats</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/app.css') }}"
    >
</head>

<body>
<main class="container page-content">

    <section class="page-header">
        <p class="eyebrow">CourtStats</p>
        <h1>Sign In</h1>
        <p class="page-description">
            Authorized users only.
        </p>
    </section>

    <section class="card">

        {% if error %}
            <div class="message message-error">
                {{ error }}
            </div>
        {% endif %}

        <form
            method="post"
            action="/login"
        >
            <div class="form-group">
                <label
                    class="form-label"
                    for="username"
                >
                    Username
                </label>

                <input
                    class="input"
                    id="username"
                    name="username"
                    type="text"
                    autocomplete="username"
                    value="{{ username }}"
                    required
                >
            </div>

            <div class="form-group">
                <label
                    class="form-label"
                    for="password"
                >
                    Password
                </label>

                <input
                    class="input"
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <div class="actions">
                <button
                    class="button button-primary"
                    type="submit"
                >
                    Sign In
                </button>
            </div>
        </form>

    </section>

</main>
</body>
</html>
