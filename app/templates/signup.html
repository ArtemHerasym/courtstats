<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#003262"
    >

    <title>
        Sign Up | CourtStats
    </title>

    <script>
        (function () {
            const root = document.documentElement;

            root.classList.add("js");

            let savedTheme = null;

            try {
                savedTheme = localStorage.getItem(
                    "courtstats-theme"
                );
            } catch (error) {
                savedTheme = null;
            }

            let theme = savedTheme;

            if (
                theme !== "light"
                && theme !== "dark"
            ) {
                theme = window.matchMedia(
                    "(prefers-color-scheme: dark)"
                ).matches
                    ? "dark"
                    : "light";
            }

            root.dataset.theme = theme;
        })();
    </script>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/app.css') }}"
    >
</head>


<body class="app-shell login-page signup-page">

<main class="auth-shell page-content">

    <div class="auth-layout">

        <div class="auth-brand">

            <div class="auth-brand-identity">

                <span
                    class="brand-mark"
                    aria-hidden="true"
                >
                    CS
                </span>

                <span>
                    CourtStats
                </span>

            </div>


            <button
                class="theme-toggle"
                type="button"
                data-theme-toggle
                aria-label="Switch to dark mode"
                title="Switch to dark mode"
            >
                <svg
                    class="theme-toggle-icon theme-toggle-icon-moon"
                    data-theme-icon="moon"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                    focusable="false"
                >
                    <path
                        d="M21 14.7A8 8 0 0 1 9.3 3a7 7 0 1 0 11.7 11.7z"
                    ></path>
                </svg>

                <svg
                    class="theme-toggle-icon theme-toggle-icon-sun"
                    data-theme-icon="sun"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                    focusable="false"
                >
                    <circle
                        cx="12"
                        cy="12"
                        r="4"
                    ></circle>
                    <path
                        d="M12 2v2m0 16v2m10-10h-2M4 12H2m17.1-7.1-1.4 1.4M6.3 17.7l-1.4 1.4m14.2 0-1.4-1.4M6.3 6.3 4.9 4.9"
                    ></path>
                </svg>

                <span
                    class="theme-toggle-label"
                    data-theme-label
                >
                    Switch to dark mode
                </span>
            </button>

        </div>


        <section class="card auth-card">

            <div class="page-header">

                <p class="eyebrow">
                    JCP Basketball Analytics
                </p>

                <h1>
                    Sign Up
                </h1>

                <p class="page-description">
                    Create your CourtStats login credentials.
                </p>

            </div>


            {% if error %}

                <div
                    class="message message-error form-alert"
                    role="alert"
                >
                    {{ error }}
                </div>

            {% endif %}


            <form
                method="post"
                action="/signup"
            >

                <input
                    type="hidden"
                    name="csrf_token"
                    value="{{ csrf_token }}"
                >


                <div class="form-group">

                    <label
                        class="form-label"
                        for="username"
                    >
                        Username
                    </label>

                    <input
                        class="input"
                        id="username"
                        name="username"
                        type="text"
                        autocomplete="username"
                        value="{{ username }}"
                        maxlength="50"
                        required
                        autofocus
                    >

                </div>


                <div class="form-group">

                    <label
                        class="form-label"
                        for="password"
                    >
                        Password
                    </label>

                    <input
                        class="input"
                        id="password"
                        name="password"
                        type="password"
                        autocomplete="new-password"
                        minlength="8"
                        maxlength="128"
                        required
                    >

                </div>


                <div class="form-group">

                    <label
                        class="form-label"
                        for="password_confirmation"
                    >
                        Confirm Password
                    </label>

                    <input
                        class="input"
                        id="password_confirmation"
                        name="password_confirmation"
                        type="password"
                        autocomplete="new-password"
                        minlength="8"
                        maxlength="128"
                        required
                    >

                </div>


                <div class="form-group">

                    <label
                        class="form-label"
                        for="school_access_code"
                    >
                        School Access Code
                    </label>

                    <input
                        class="input"
                        id="school_access_code"
                        name="school_access_code"
                        type="password"
                        autocomplete="off"
                        required
                    >

                </div>


                <div class="actions">

                    <button
                        class="button button-primary"
                        type="submit"
                    >
                        Create Account
                    </button>

                </div>

            </form>


            <div class="auth-secondary-action">

                <p>
                    Already have an account?
                </p>

                <a
                    class="button auth-secondary-button"
                    href="/login"
                >
                    Log In
                </a>

            </div>

        </section>


        <p class="auth-footnote">
            Authorized JCP users only.
        </p>

    </div>

</main>


<script
    src="{{ url_for('static', path='js/app.js') }}"
></script>

</body>
</html>
