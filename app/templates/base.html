<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#003262"
    >

    <title>
        {% block title %}CourtStats{% endblock %}
    </title>

    <!--
        Apply the saved/system theme before the page renders.
        This prevents a light-theme flash when dark mode is active.
    -->
    <script>
        (function () {
            const root = document.documentElement;

            root.classList.add("js");

            let savedTheme = null;

            try {
                savedTheme = localStorage.getItem(
                    "courtstats-theme"
                );
            } catch (error) {
                savedTheme = null;
            }

            let theme = savedTheme;

            if (
                theme !== "light"
                && theme !== "dark"
            ) {
                theme = window.matchMedia(
                    "(prefers-color-scheme: dark)"
                ).matches
                    ? "dark"
                    : "light";
            }

            root.dataset.theme = theme;
        })();
    </script>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/app.css') }}"
    >

    {% block head %}{% endblock %}
</head>

{% set current_path = request.url.path %}

<body>

<header class="site-header">
    <div class="container">

        <nav
            class="navbar"
            aria-label="Primary navigation"
            data-navbar
        >

            <!-- CourtStats identity -->
            <a
                href="{{ url_for('home_page') }}"
                class="brand"
                aria-label="CourtStats home"
            >
                <span
                    class="brand-mark"
                    aria-hidden="true"
                >
                    CS
                </span>

                <span>
                    CourtStats
                </span>
            </a>


            <!-- Mobile menu control -->
            <button
                class="nav-menu-toggle"
                type="button"
                aria-expanded="false"
                aria-controls="primary-navigation"
                data-nav-toggle
            >
                Menu
            </button>


            <div
                class="nav-panel"
                id="primary-navigation"
                data-nav-panel
            >

                <div class="nav-links">

                    <a
                        href="{{ url_for('home_page') }}"
                        class="nav-link{% if current_path == '/' %} nav-link-active{% endif %}"
                        {% if current_path == "/" %}
                            aria-current="page"
                        {% endif %}
                    >
                        Home
                    </a>


                    <a
                        href="{{ url_for('seasons_page') }}"
                        class="nav-link{% if current_path.startswith('/app/seasons') %} nav-link-active{% endif %}"
                        {% if current_path.startswith("/app/seasons") %}
                            aria-current="page"
                        {% endif %}
                    >
                        Seasons
                    </a>


                    <a
                        href="{{ url_for('players_page') }}"
                        class="nav-link{% if current_path.startswith('/app/players') or current_path.startswith('/app/season-rosters') %} nav-link-active{% endif %}"
                        {% if current_path.startswith("/app/players") or current_path.startswith("/app/season-rosters") %}
                            aria-current="page"
                        {% endif %}
                    >
                        Players
                    </a>


                    <a
                        href="{{ url_for('roster_page') }}"
                        class="nav-link{% if current_path.startswith('/app/roster') %} nav-link-active{% endif %}"
                        {% if current_path.startswith("/app/roster") %}
                            aria-current="page"
                        {% endif %}
                    >
                        Roster
                    </a>


                    <a
                        href="{{ url_for('games_page') }}"
                        class="nav-link{% if current_path.startswith('/app/games') %} nav-link-active{% endif %}"
                        {% if current_path.startswith("/app/games") %}
                            aria-current="page"
                        {% endif %}
                    >
                        Games
                    </a>


                    <a
                        href="{{ url_for('external_games_page') }}"
                        class="nav-link{% if current_path.startswith('/app/external-games') %} nav-link-active{% endif %}"
                        {% if current_path.startswith("/app/external-games") %}
                            aria-current="page"
                        {% endif %}
                    >
                        External Games
                    </a>

                </div>


                <div class="nav-actions">

                    <a
                        class="button button-primary nav-add-game"
                        href="{{ url_for('new_game_page') }}"
                    >
                        Add Game
                    </a>


                    <button
                        class="theme-toggle"
                        type="button"
                        data-theme-toggle
                        aria-label="Switch to dark mode"
                        title="Switch to dark mode"
                    >
                        <svg
                            class="theme-toggle-icon theme-toggle-icon-moon"
                            data-theme-icon="moon"
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                            focusable="false"
                        >
                            <path
                                d="M21 14.7A8 8 0 0 1 9.3 3a7 7 0 1 0 11.7 11.7z"
                            ></path>
                        </svg>

                        <svg
                            class="theme-toggle-icon theme-toggle-icon-sun"
                            data-theme-icon="sun"
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                            focusable="false"
                        >
                            <circle
                                cx="12"
                                cy="12"
                                r="4"
                            ></circle>
                            <path
                                d="M12 2v2m0 16v2m10-10h-2M4 12H2m17.1-7.1-1.4 1.4M6.3 17.7l-1.4 1.4m14.2 0-1.4-1.4M6.3 6.3 4.9 4.9"
                            ></path>
                        </svg>

                        <span
                            class="theme-toggle-label"
                            data-theme-label
                        >
                            Switch to dark mode
                        </span>
                    </button>


                    <form
                        method="post"
                        action="/logout"
                    >

                        <input
                            type="hidden"
                            name="csrf_token"
                            value="{{ request.session.get('csrf_token', '') }}"
                        >

                        <button
                            class="button button-secondary"
                            type="submit"
                        >
                            Log out
                        </button>

                    </form>

                </div>

            </div>

        </nav>

    </div>
</header>


<main class="container page-content">

    {% block content %}
    {% endblock %}

</main>


<script
    src="{{ url_for('static', path='js/app.js') }}"
></script>

{% block scripts %}{% endblock %}

</body>
</html>
