<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}CourtStats{% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/app.css') }}"
    >

    {% block head %}{% endblock %}
</head>

<body>

<header class="site-header">
    <div class="container">

        <nav class="navbar">

            <a
                href="{{ url_for('home_page') }}"
                class="brand"
            >
                CourtStats
            </a>


            <div class="nav-links">

                <a
                    href="{{ url_for('home_page') }}"
                    class="nav-link"
                >
                    Home
                </a>

                <a
                    href="{{ url_for('seasons_page') }}"
                    class="nav-link"
                >
                    Seasons
                </a>

                <a
                    href="{{ url_for('players_page') }}"
                    class="nav-link"
                >
                    Players
                </a>

                <a
                    href="{{ url_for('roster_page') }}"
                    class="nav-link"
                >
                    Roster
                </a>

                <a
                    href="{{ url_for('games_page') }}"
                    class="nav-link"
                >
                    Games
                </a>

                <a
                    href="{{ url_for('external_games_page') }}"
                    class="nav-link"
                >
                    External Games
                </a>

            </div>


            <a
                class="button button-primary"
                href="{{ url_for('new_game_page') }}"
            >
                Add Game
            </a>


            <form
                method="post"
                action="/logout"
            >

                <input
                    type="hidden"
                    name="csrf_token"
                    value="{{ request.session.get('csrf_token', '') }}"
                >

                <button
                    class="button button-secondary"
                    type="submit"
                >
                    Log out
                </button>

            </form>

        </nav>

    </div>
</header>


<main class="container page-content">

    {% block content %}
    {% endblock %}

</main>


<script
    src="{{ url_for('static', path='js/app.js') }}"
></script>

{% block scripts %}{% endblock %}

</body>
</html>
