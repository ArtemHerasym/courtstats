<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}CourtStats{% endblock %}</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/app.css') }}"
    >

    {% block head %}{% endblock %}
</head>

<body>
    <header class="site-header">
        <div class="container">
            <nav class="navbar">
                <a href="/" class="brand">
                    CourtStats
                </a>

                <div class="nav-links">
                    <a href="/" class="nav-link">Dashboard</a>
                    <span class="nav-link nav-link-disabled">Seasons</span>
                    <span class="nav-link nav-link-disabled">Roster</span>
                    <span class="nav-link nav-link-disabled">Games</span>
                </div>

                <span class="button button-primary button-disabled">
                    Add Game
                </span>
            </nav>
        </div>
    </header>

    <main class="container page-content">
        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', path='js/app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
