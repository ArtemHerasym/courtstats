{% extends "base.html" %}

{% block title %}
{{ title }} | CourtStats
{% endblock %}


{% block content %}

<section class="card empty-state">

    <div class="empty-state-content">

        <p class="eyebrow">
            CourtStats
        </p>

        <h1>{{ title }}</h1>

        <p class="page-description">
            {{ message }}
        </p>

        <div class="actions">

            <a
                class="button button-primary"
                href="{{ back_url }}"
            >
                {{ back_label }}
            </a>

        </div>

    </div>

</section>

{% endblock %}
