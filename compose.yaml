services:
  database:
    image: postgres:17
    container_name: courtstats-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - courtstats_postgres_data:/var/lib/postgresql/data

volumes:
  courtstats_postgres_data: